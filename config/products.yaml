# Product families by company (sachi2.md S4). Used by extract.detect_product.
# Keys are canonical company names from config/aliases.yaml.
#
#   name:        the product or series name exactly as the company writes it. Matched as a whole phrase;
#                names of 4 letters or fewer, or written all in capitals, are matched case-sensitively.
#   verified:    true only if the name was seen on the company's OWN website on `checked_on`.
#                false = seen only on third-party sites (distributors, trade press); still usable for
#                matching because a match needs the exact name in the article, but re-check it.
#   checked_at:  the page where it was seen.
#
# Detection never guesses: a name is returned only if it is written in the title or text, and only for
# the item's own company (or, when the company is unknown, only if all names found belong to one company).

