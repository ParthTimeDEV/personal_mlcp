# Discovery seeds (Phase 2, Ragini). Starting points for the scout engine, NOT approvals.
#
# Every entry is `verified: false`: the homepages below were compiled from general knowledge of the compressed
# air, vacuum, blower, gas/hydrogen compression and standards sectors and have not been opened one by one.
# A wrong or dead address simply fails the automatic vetting (atlas/scout/vet.py); that is expected.
# The vetter decides whether a seed is usable, and only Atlas Copco approves sources.
#
# Fields: name, url (homepage), type_guess (competitor | trade_news | government), region (US | CA | MX),
#         why, verified (always false until a person has hand-checked it), association (optional, true for
#         industry associations; they earn trust points as associations).
#
# Not included on purpose: sites already in config/sources.yaml (including the blocked ones: CAGI,
# PR Newswire, Plant Services, Plant Engineering, Ingersoll Rand, Business Wire). Those need permission first.
# Atlas Copco's own sites are left out too: the client's newsroom adds nothing to a market study.
# Endeavor Business Media titles (Hydraulics & Pneumatics, Chemical Processing, ...) are left out because
# their group terms forbid automated access (see docs/source_vetting.md, Plant Services).

